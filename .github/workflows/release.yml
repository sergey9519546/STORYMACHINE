name: Release

# Publishes a versioned, rollback-able Docker image to GitHub Container
# Registry. Two triggers:
#   - push of a `v*` tag (the normal release path: `git tag v1.2.3 && git
#     push origin v1.2.3`)
#   - workflow_dispatch (manual re-run, e.g. to republish an image after a
#     registry outage, without cutting a new tag)
#
# The `test` and `browser` jobs mirror ci.yml's gates so a broken tag/dispatch
# can never publish a broken image — `publish` has a hard `needs: [test,
# browser]` dependency and will not run if either fails. This intentionally
# duplicates ci.yml's steps rather than depending on a ci.yml run for this
# ref/SHA (workflow_dispatch has no associated PR/push CI run to depend on, and
# tag-push CI runs are a separate, not-guaranteed-synchronous workflow run).
#
# "MIRRORS" IS A CLAIM THIS FILE HAS TO KEEP EARNING. It previously said it
# mirrored ci.yml while running 7 steps to ci.yml's 10: no receipt check, no
# RUN_E2E, no doc-quality check, no unverified-gates report, and a shallow
# checkout. A tag push could therefore publish an image built from an
# unreceipted scoring change. Every ci.yml gate now has a counterpart here, and
# tests/core/ci-gates-intact.test.ts asserts the correspondence step by step so
# the two files cannot silently diverge again. (2026-09-02: the browser battery
# — six live-Chromium suites that ran on one developer's machine and nowhere
# else — became a gate here too. A release is the last place to ship
# certifications nobody has executed.)
#
# The ONE deliberate difference, stated rather than hidden: the receipt check
# runs in --structural-only mode over the whole release window (previous v*
# tag → this ref) instead of a single change's range. See the step's own
# comment and the flag's documentation in scripts/check-scoring-receipt.mjs.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Workflow-level permissions are the FLOOR every job inherits, so the registry
# write token must not live here: `packages: write` at this level meant the
# `test` job held a GHCR push credential while running `npm ci` — a malicious
# postinstall in any transitive dependency would have had it. The publish job
# declares `packages: write` for itself; the test job gets read-only.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Same reason as ci.yml: the scoring-receipt guard needs real history
          # (and a resolvable previous release tag) to diff against. A depth-1
          # checkout silently degrades it to "no base ref — nothing to check".
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      # Same gate as ci.yml, same script. The exemption set comes from
      # tsconfig.json's quarantine declaration and every exemption is proven
      # unreachable from server.ts/server/app.ts before the scan runs — see
      # ci.yml's comment and scripts/check-no-console.mjs's header for why the
      # old inline grep (which matched --exclude patterns against BASE NAMES
      # and so exempted the live route barrel) is gone from both files.
      - name: Enforce no console.* under server/
        run: npm run check-no-console

      # Mirrors ci.yml's server dead-code tripwire. Added here when the
      # step-for-step mirror assertion in tests/core/ci-gates-intact.test.ts
      # caught this file lagging ci.yml by one step — which is precisely the
      # drift that assertion exists to prevent, working as intended on its
      # first real opportunity.
      - name: Server dead-code tripwire (reachability from server.ts)
        run: npm run check-server-reachability

      # G0-08: mirrors ci.yml's honesty string audit — see that file's
      # comment and scripts/honesty-audit.mjs for scope and rules.
      # HONESTY_AUDIT_REPO is set here for the same reason ci.yml sets it: the
      # repo-metadata lane is env-gated for offline determinism, and a gate
      # nothing sets is a check that silently never runs. A release is exactly
      # when the repo's public description matters most.
      - name: Honesty string audit
        run: npm run honesty-audit
        env:
          HONESTY_AUDIT_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      # Mirrors ci.yml. Non-blocking there, non-blocking here — the ONLY step
      # in this job that is allowed to be.
      - name: Check documentation quality
        run: npm run check-docs
        continue-on-error: true

      # Mirrors ci.yml's project-brain freshness check — see that file's
      # comment. Blocking here too: a release is the last place to publish
      # with a stale docs/brain/ graph export.
      - name: Check project brain (docs/brain freshness)
        run: npm run check-brain

      - name: Run tests (keyless — analysis-only posture)
        # Mirrors ci.yml: RUN_E2E gates tests/e2e/journeys.test.ts, the only
        # full-stack test. A release is the last place to skip it.
        env:
          RUN_E2E: "1"
        run: npm test

      # Mirrors ci.yml's receipt gate, scoped to a release instead of a change.
      # A tag does not "introduce" commits, so there is no push range to diff:
      # the meaningful question at release time is whether every scoring-path
      # change since the PREVIOUS release shipped with a receipt entry. That is
      # what this diffs.
      #
      # --structural-only is deliberate and is NOT a weakening of ci.yml's
      # gate: entry CONTENT (SHA resolvability, no simulation language,
      # required fields) is validated by ci.yml on the narrow range that adds
      # the entry, which is the only moment it can be validated — an honest
      # entry cites the branch SHA it was measured at, and that object stops
      # resolving once the branch is squash-merged. Re-checking it here would
      # fail releases on the most carefully written receipts in the ledger.
      # (Verified: the honest 2026-08-04 and 2026-08-07 entries both cite SHAs
      # that no longer resolve.)
      - name: Scoring-path change requires a measurement receipt
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -n "${PREV_TAG}" ]; then
            echo "Release window: ${PREV_TAG}..${GITHUB_SHA}"
            node scripts/check-scoring-receipt.mjs --structural-only "${PREV_TAG}..${GITHUB_SHA}"
          else
            echo "No previous v* tag reachable from ${GITHUB_SHA} — falling back to the default range."
            node scripts/check-scoring-receipt.mjs --structural-only
          fi

      # Mirrors ci.yml: names the env-gated suites that did NOT run, so a green
      # release job is not mistaken for "everything was verified". Blocking
      # since 2026-09-03 — a gate past its recorded `expires` date exits 1 here
      # too (retrospective finding #9). A release is the last place to publish
      # over a gap whose own deadline has passed.
      - name: Report unverified gates
        if: always()
        run: node scripts/report-unverified-gates.mjs

      - name: Metamorphic scoring gate
        run: npm run test:metamorphic

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: "test-key-ci"

  # ──────────────────────────────────────────────────────────────────────────
  # The browser battery. Eight live-Chromium suites (smoke-p0-live-flow,
  # verify-focus-traps, verify-p2-p3-surfaces, verify-ui-polish-affordances,
  # verify-e4-local-safety-net, verify-e5-command-palette, verify-a11y,
  # verify-production-build) that boot the real server and drive the real UI —
  # see ci.yml's copy of this comment for what verify-production-build adds
  # (the one suite in the battery that boots NODE_ENV=production, i.e. the
  # Dockerfile's actual path, instead of dev).
  #
  # These used to run on exactly ONE machine. Three of their own headers
  # asserted they "must not be wired into CI" because "CI has no browser
  # provisioned" — a self-imposed limitation, not a fact: an ubuntu runner
  # provisions Chromium in the one step below. The consequence of the old
  # claim was measured, not hypothetical: the SSE migration broke the
  # report-render wait in two suites and an ARIA role change broke a selector
  # in a third, and all three rotted for days because nothing ran them.
  #
  # A SEPARATE JOB on purpose: it runs in parallel with `test`, so provisioning
  # a browser (~1 browser download) never lengthens the lint/test path, and a
  # browser-infrastructure flake is legible as such instead of being mixed into
  # the unit-test signal. `playwright` is a pinned devDependency, so the
  # installed browser build always matches the client driving it.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `npm ci` installs the Playwright CLIENT only — modern playwright
      # packages ship no browser-downloading install script, which is why this
      # step is explicit rather than implied. --with-deps adds the shared
      # libraries headless Chromium needs on a bare ubuntu image.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # PW_CHROMIUM_PATH is deliberately NOT set: unset means "let Playwright
      # resolve the build it pins", which is the path the step above
      # provisions. The env override exists for machines that pre-provision a
      # browser outside Playwright's cache (the development container), and
      # keeping it unset here is what proves the CI path really works.
      - name: Browser verification battery
        run: npm run verify:browser

  publish:
    # A release must not ship with rotted proofs: `publish` blocks on the
    # browser battery exactly as it blocks on `test`. Before 2026-09-02 the
    # battery ran nowhere, so a tag could publish an image whose live-surface
    # certifications had not been executed against that code in days.
    needs: [test, browser]
    runs-on: ubuntu-latest
    # The registry write scope lives HERE, not at workflow level, so it is not
    # inherited by the test job's `npm ci`.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # On a tag push, VERSION is the tag with its leading "v" stripped
      # (v1.2.3 -> 1.2.3). On workflow_dispatch (no tag ref), fall back to
      # the package.json version so a manual re-publish still gets a
      # meaningful, non-"unknown" tag rather than failing or defaulting to
      # something misleading.
      #
      # IS_PRERELEASE drives the `:latest` tag below. A SemVer version with a
      # prerelease identifier (1.0.0-rc.1, 2.0.0-beta.3) is by definition not
      # what a user typing `docker pull …:latest` is asking for. This was not
      # gated before, and the consequence is live: ghcr.io/…/storymachine:latest
      # currently resolves to 1.0.0-rc.1 — the release candidate overwrote the
      # stable tag simply by being tagged after it.
      - name: Compute release version and commit SHA
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          if [[ "${VERSION}" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION} (prerelease: ${IS_PRERELEASE})"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Image name is lowercased explicitly: ghcr.io requires a lowercase
      # repository path, but ${{ github.repository_owner }}/${{ github.repository }}
      # is not guaranteed lowercase (org/user names can have mixed case).
      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      # `:latest` is appended only for a non-prerelease version — see the
      # meta step's comment. The version tag is always pushed, so a
      # prerelease is still fully published and pullable by its exact tag.
      - name: Compute image tags
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "${IMAGE_NAME}:${VERSION}"
            if [[ "${IS_PRERELEASE}" == "false" ]]; then
              echo "${IMAGE_NAME}:latest"
            else
              echo "Skipping :latest — ${VERSION} is a prerelease." >&2
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.sha }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
