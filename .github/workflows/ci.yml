name: CI

# Deliberately NO `paths-ignore` filter on either trigger below, and none
# should be added later without reading this: the test job's honesty-audit
# and check-brain steps, plus the brain-coverage and claims-register-citation
# suites that run inside `npm test`, are DOCS checks that can fail on a
# documentation-only push (a broken wikilink, a stale brain export, an
# overclaim string, a missing register row). `check-docs` is NOT part of this
# argument — it is `continue-on-error: true` below and cannot fail the job;
# the checks that do gate docs are the ones just named. Skipping the job by
# path would skip the checks that actually catch a docs regression.
on:
  push:
    branches: ["**"]
    # See the no-paths-ignore comment above `on:` before adding one here.
  pull_request:
    branches: ["**"]
    # Same — see above.

# Cancel a superseded run instead of running beside it. Before this, three
# quick pushes to one lane branch (docs-only commits included) started three
# full runs of both jobs at once: measured 2026-09-13 on
# lane/voice-bound-ci-derivation, runs 34741882322 / 34741923678 /
# 34741928418, all in progress simultaneously at 06:05-06:06 UTC for three
# commits whose last two touched only a report's Tip line (test job ~7 min +
# browser job ~5 min, each run). The group is keyed on the ref, so pushes to
# DIFFERENT branches never collide, only a branch (or PR head) against its
# own earlier run.
#
# `main` gets its OWN group per commit (the `github.sha` suffix below),
# rather than merely being excluded from `cancel-in-progress`: a false value
# there stops GitHub cancelling a RUNNING run, but a second rule still
# applies to a group — a run queued while one is already in progress becomes
# PENDING, and any run already pending in that group is cancelled to make
# room. Two pushes to main inside one CI window (running + pending) plus a
# third queuing would silently drop the pending one with no conclusion to
# cite, `cancel-in-progress: false` notwithstanding. Giving every main commit
# its own group (via the sha suffix) means no other run — running or
# pending — is ever in it, so nothing about main can be cancelled OR dropped,
# full stop, not merely "not cancelled while running". `cancel-in-progress`
# is still keyed on `!= main` for branches/PRs, where a shared group and
# real cancellation are exactly what this exists to do.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege, declared explicitly. Without a `permissions:` block a
# workflow inherits the repository/organization default, which on many repos is
# still the legacy read/write GITHUB_TOKEN — every step in this job, including
# `npm ci` and any postinstall script it runs, would hold a token able to push
# commits, move tags, and edit issues. This job only ever needs to read the
# checkout. (release.yml scopes its `packages: write` to the publish job for the
# same reason.)
permissions:
  contents: read

jobs:
  # Docs-only fast-path classifier (2026-09-18, docs/audits/2026-09-18-ci-docs-
  # fast-path/README.md). Computes whether THIS push's changed-file set falls
  # entirely inside the conservative docs allowlist (docs/**, **/*.md) — see
  # scripts/lib/docs-only.mjs for the matching rules and their failure
  # direction (anything it cannot positively prove is docs-only classifies as
  # a full run). A SEPARATE JOB, not a step inside `test`: `browser` below
  # needs to skip at the JOB level (no checkout, no `npm ci`, no Chromium
  # download — the ~5-minute cost this exists to remove lives in that
  # provisioning, not only in the battery step), and a step cannot gate its
  # own job's `if:`. `test` and `browser` both `needs: classify`.
  #
  # WHAT THAT SERIALIZATION COSTS, measured rather than waved at (round-2
  # review item 8, which found the original "a few seconds" unquantified).
  # Run 35294788628 (a FULL run on this lane): the `classify` job occupied
  # 01:18:33 -> 01:18:41, EIGHT seconds, and `test`/`browser` were not created
  # until 01:18:43 — about 10 s of added wall time, plus one extra runner
  # slot, on EVERY full run, which is the majority of runs. Against the
  # docs-only saving it is still a large net win — run 35296219834, the first
  # real fast-path run on this branch, took 01:39:37 -> 01:40:56, 1 m 19 s in
  # total, against the 9 m 03 s a docs-only push cost before this lane
  # (run 34793742299 on main) — but it is a real cost and it is stated here
  # rather than discovered later.
  #
  # RANGE, and why it is not `github.event.before` (round-2 review item 5).
  # `cancel-in-progress` above cancels a lane branch's in-flight run on the
  # next push. A push carrying a `server/**` change whose run is cancelled by
  # a following docs-only push would, chaining from `before`, leave the branch
  # with one completed GREEN run over code nothing ever tested. The classifier
  # therefore diffs from `merge-base(<tip of the last SUCCESSFUL run of this
  # workflow on this ref>, before)` — see scripts/lib/validated-base.mjs. In
  # the ordinary case that tip IS `before` and the range is unchanged.
  #
  # THIS JOB NEVER SKIPS ANYTHING ITSELF. It only ever adds information; every
  # check that gates a docs change today (honesty-audit, check-docs,
  # check-brain, and the docs-gating test files run below) still runs on
  # every docs push, unconditionally. Only checks that cannot be affected by a
  # docs/**-or-**/*.md-only change (build, the full `npm test`, metamorphic,
  # no-console/server-reachability grep, the scoring-receipt guard, and the
  # whole browser battery) are skipped, and only when this job says so.
  classify:
    runs-on: ubuntu-latest
    # Narrowest grant that lets the classifier ask which run of THIS workflow,
    # on THIS ref, last COMPLETED SUCCESSFULLY — the only commit it is willing
    # to treat as already validated (round-2 review item 5; the full argument
    # is in scripts/lib/validated-base.mjs's header). `actions: read` is
    # read-only over workflow-run metadata and is scoped to this job alone, so
    # the `test` and `browser` jobs below keep the workflow-level
    # `contents: read` and nothing else. Without this grant the runs API
    # answers 403, the classifier cannot establish a validated base, and every
    # push classifies FULL — the safe direction, and legible in the step's own
    # log rather than silent.
    permissions:
      contents: read
      actions: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Same reason as the test job below: the classifier diffs against a
          # `before` SHA that must actually resolve in this checkout — and, as
          # of round 2, also against the tip of the last successful run on
          # this ref, which can be several pushes back.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Classify changed files (docs-only fast path)
        id: classify
        env:
          DOCS_ONLY_BEFORE_SHA: ${{ github.event.before }}
          # Round-2 review item 6: `before` had an explicit env wire and
          # `forced` did not, so a force-push whose payload could not be read
          # silently classified as an ordinary push. Both are wired now; the
          # script ORs this with the payload, so neither one alone is
          # load-bearing.
          DOCS_ONLY_FORCED: ${{ github.event.forced }}
          # Used only to authenticate the workflow-runs query above. Scoped by
          # the job-level `permissions:` block to read-only Actions metadata.
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/classify-docs-only.mjs

  test:
    runs-on: ubuntu-latest
    needs: classify
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (not the default shallow depth-1 clone): the scoring-
          # receipt guard below runs `git diff origin/main...HEAD`, which needs
          # both a resolvable `origin/main` ref and the actual commit range —
          # neither exists in a depth-1 checkout on a PR's merge ref.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Skipped on a docs-only push: tsc type-checks the TypeScript project
      # tree, which a docs/**-or-**/*.md-only change cannot touch (tsconfig.json
      # has no `include` targeting markdown, and is itself outside the docs
      # allowlist — a change to it fails classify-docs-only.mjs's classification).
      - name: Type check
        if: needs.classify.outputs.docs_only != 'true'
        run: npm run lint

      # Mechanical enforcement of CLAUDE.md's "no console.* under server/**"
      # rule — a written convention only reliably holds when CI holds it.
      #
      # This used to be an inline `grep -rn 'console\.' server ...` with a long
      # list of `--exclude=` flags. It did not work. When grep searches
      # RECURSIVELY, `--exclude=GLOB` matches each file's BASE NAME, not its
      # path — so `--exclude=index.ts` exempted every index.ts in the tree,
      # including server/routes/nvm/index.ts, the live route barrel mounted by
      # server/app.ts (plus the live quality/, project/, and bible/ barrels).
      # Reproduced: `console.log("GATE PROBE")` appended to the live route
      # barrel passed the old step with exit 0.
      #
      # That was the SECOND round of this same bug here (the previous one was
      # `--exclude-dir=kernel` hiding the live event-store closure), so the fix
      # is not another flag list. scripts/check-no-console.mjs derives its
      # exemptions from tsconfig.json's `exclude` array — the repo's existing,
      # path-anchored quarantine declaration — and then PROVES each exemption
      # is dead by walking the import graph out from server.ts/server/app.ts.
      # An exemption covering code the server can reach fails the build, so a
      # third occurrence cannot be introduced by editing a list.
      # Skipped on a docs-only push: this scans server/**, which such a push
      # by definition never touches.
      - name: Enforce no console.* under server/
        if: needs.classify.outputs.docs_only != 'true'
        run: npm run check-no-console

      # Dead-code tripwire for server/**: static BFS from server.ts, failing on
      # any unreachable non-test file that is not on the script's explicit,
      # justified allowlist. src/ has had an equivalent check since the P2
      # surface work (verify-p2-p3-surfaces.mjs's staticCrossCheck); server/ had
      # none, which is how 78 files / 24,722 LOC accumulated there unnoticed.
      # Blocking, and it passes today by construction: everything currently
      # unreachable is allowlisted BY NAME with a reason. It removes nothing —
      # it only stops the pile growing while the owner decides what to keep.
      # Skipped on a docs-only push: static BFS from server.ts over server/**,
      # which such a push by definition never touches.
      - name: Server dead-code tripwire (reachability from server.ts)
        if: needs.classify.outputs.docs_only != 'true'
        run: npm run check-server-reachability

      # G0-08: user-facing honesty string audit — fails the build on
      # overclaim language ("Hollywood gold standard", "provably", stale
      # hardcoded rule/corpus counts, unverified superlatives, etc.) in the
      # shipped surface. See scripts/honesty-audit.mjs for scope and rules.
      #
      # HONESTY_AUDIT_REPO enables the repo-metadata lane, which runs the same
      # PATTERNS against the repository's description/homepage/topics. It is
      # env-gated so a local, offline run stays deterministic — and it is set
      # HERE precisely so the gate is not decorative. (The repo already has one
      # env-gated check, REAL_SCRIPT_CORPUS_DIR, that is set nowhere in
      # .github/ and has therefore silently skipped on every CI run since it
      # was written; that is the failure mode this line exists to avoid.)
      # The lane is warn-only today because the fix is a repo-admin edit to the
      # About panel, not something a PR can change — see REPO_METADATA_BLOCKING
      # in scripts/honesty-audit.mjs for the one-line flip to blocking.
      - name: Honesty string audit
        run: npm run honesty-audit
        env:
          HONESTY_AUDIT_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      # Documentation quality check: scan markdown files for AI writing patterns
      # Uses avoid-ai-writing Tier 1 patterns (25 high-confidence markers)
      # Non-blocking (warnings only) to avoid false positives on legitimate usage
      - name: Check documentation quality
        run: npm run check-docs
        continue-on-error: true

      # docs/brain/ is the project brain — an Obsidian-compatible knowledge
      # graph over the Decision Log, gates, surfaces, session records, audits,
      # and measurement docs (see CLAUDE.md's "Project brain" paragraph and
      # tests/core/brain-coverage.test.ts, which runs as part of `npm test`
      # below and asserts every source-of-truth entry has a note). This step
      # only checks that the committed graph export (brain.graph.json,
      # GRAPH.md) matches what scripts/brain-graph.mjs would regenerate right
      # now, and that every wikilink resolves — a stale or broken graph export
      # is a doc bug the same way a stale generated rulebook would be.
      # Blocking, like the other check-* steps above: unlike check-docs (AI
      # writing patterns, judgment calls), a stale export or a dangling
      # [[wikilink]] is unambiguous.
      - name: Check project brain (docs/brain freshness)
        run: npm run check-brain

      # Deliberately NO GEMINI_API_KEY here: the product's official keyless
      # analysis-only mode is what CI must prove. With a fake key set, the
      # "keyless" degradation paths construct a real client and attempt live
      # HTTPS calls to the AI provider (passing only because failures degrade)
      # — a flake source, an outbound network dependency, and a posture the
      # suite was never meant to test. The full suite passes keyless.
      # Skipped on a docs-only push in favor of the narrower "Run docs-gating
      # tests" step below — see that step's comment for which files still run
      # and why, and docs/audits/2026-09-18-ci-docs-fast-path/README.md for
      # the full accounting of every check kept vs skipped.
      - name: Run tests (keyless — analysis-only posture)
        if: needs.classify.outputs.docs_only != 'true'
        # RUN_E2E gates tests/e2e/journeys.test.ts — the only full-stack test
        # (boots a real server, drives the writer journey over HTTP). It was
        # skipped on every CI run since it was written; first executed
        # 2026-08-03 (10/10, ~3s, three consecutive clean runs). No reason to
        # leave the one end-to-end check dark: enabled.
        #
        # GIT_SHA (P3, 2026-09-06): the same build-time identity env the
        # Dockerfile bakes (ARG GIT_SHA -> ENV GIT_SHA), set explicitly here
        # too rather than left to server/lib/build-info.ts's checkout
        # fallback — a report generated during this step should carry the
        # exact commit CI is testing, not "whatever `git rev-parse HEAD`
        # happens to resolve to" on a runner whose checkout config could
        # change independently of this line. github.sha is always the full
        # 40-hex SHA CI is running (the PR merge commit on a pull_request
        # event, the pushed commit on a push event).
        env:
          RUN_E2E: "1"
          GIT_SHA: ${{ github.sha }}
        # `shell: bash` is explicit, not relied on as the ambient default:
        # this job is `ubuntu-latest` with no `container:`, so GitHub's own
        # default `run:` shell already is `bash --noprofile --norc -eo
        # pipefail {0}` — but that default is a property of the RUNNER, and
        # would silently change to `sh` (no `set -o pipefail` support) if
        # this step ever moved into a container image lacking bash. Pinning
        # it here means that migration cannot silently drop pipefail; it can
        # only fail loudly if bash is missing.
        shell: bash
        # `set -o pipefail` is ALSO explicit in the script itself (belt and
        # braces with the `shell:` pin above): without it, a failing
        # `npm test` piped into `tee` would report the EXIT CODE OF `tee`
        # (0, since tee itself succeeds), silently turning a red test run
        # into a green step. `2>&1` folds stderr into the same file the TAP
        # reporter's stdout goes to, since a crash can write to either.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.tap

      # Runs ONLY on a docs-only push, in place of the full `npm test` above.
      # This is the set of test files that can actually FAIL on a
      # docs/**-or-**/*.md-only change — each one reads committed documentation
      # (a brain note, a claims-register row, a generated rulebook page, the
      # P0 sample report, a measurement receipt, the ROADMAP's P3 section,
      # README/CONTRIBUTING prose) and asserts it still matches what the live
      # generator or a citing source claims.
      #
      # THIS LIST IS NOT HAND-PICKED AND IS NOT ALLOWED TO BE. Round 1 selected
      # it by judgment from a grep and missed two suites that gate docs
      # (tests/routes/root-cause-parity.test.ts and
      # tests/core/scoring-receipt-guard.test.ts); extending the same
      # derivation found a third (tests/core/telemetry-docs-truth.test.ts,
      # which reads the real ROADMAP.md). The set is now derived MECHANICALLY
      # and pinned by tests/core/docs-gating-set.test.ts, which recomputes the
      # candidates from tests/** and fails when a suite that reads committed
      # documentation appears in neither this list nor that test's explicit,
      # reasoned exclusion allowlist. Do not edit this list by hand without
      # that test agreeing — and never edit it to make that test pass.
      #
      # Measured wall time for all EIGHTEEN, this sandbox, run individually:
      # ~56 s total (41.3 s for the sixteen originals, 13.7 s for
      # docs-gating-set.test.ts, which parses every test file, and 0.6 s for
      # edge-docs-gate.test.ts; slowest of the rest: rule-test-coverage 8.6 s,
      # public-benchmark 6.4 s, honesty-audit-claims 5.3 s, root-cause-parity
      # 5.3 s). On the runner the seventeen-file version of this step took 44 s
      # (run 35301550263, step 12). Against a ~7-minute `npm test` plus a
      # ~5-minute browser job.
      - name: Run docs-gating tests (docs-only fast path)
        if: needs.classify.outputs.docs_only == 'true'
        run: |
          set -e
          for f in \
            tests/core/brain-coverage.test.ts \
            tests/core/claims-row-citations.test.ts \
            tests/core/coverage-letter.test.ts \
            tests/core/docs-gating-set.test.ts \
            tests/core/documentation-truth.test.ts \
            tests/core/edge-docs-gate.test.ts \
            tests/core/finding-jump.test.ts \
            tests/core/honesty-audit-claims.test.ts \
            tests/core/p0-sample-drift.test.ts \
            tests/core/p0-session-records.test.ts \
            tests/core/public-benchmark.test.ts \
            tests/core/rule-test-coverage.test.ts \
            tests/core/rulebook-links.test.ts \
            tests/core/rulebook.test.ts \
            tests/core/scoring-receipt-guard.test.ts \
            tests/core/telemetry-docs-truth.test.ts \
            tests/routes/root-cause-parity.test.ts \
            tests/scripts/owner-measure-plan.test.ts \
            tests/scripts/smoke-gate-serve-mode.test.ts \
          ; do
            echo "::group::$f"
            node --experimental-strip-types "$f"
            echo "::endgroup::"
          done

      # 2026-09-13 (ci-concurrency round 2, item 7): the GitHub job-log API
      # returns only the LAST ~100 KB of a job's log. This step's TAP stream
      # is ~13,800 tests over ~7 minutes — far bigger than that — so a red
      # run's `not ok` lines can scroll out of the readable tail entirely.
      # Found reading run 34741928418: its job summary said "# fail 2" with
      # no way to name the two failures from the API. `if: always()` is
      # required, not decoration — this is exactly the case where the
      # PREVIOUS step failed, and a step with no `if:` is skipped once an
      # earlier step in the job fails. scripts/tap-failures.mjs degrades
      # gracefully (prints one line, exits 0) if test-output.tap does not
      # exist at all — e.g. an earlier step like `npm ci` failed before
      # "Run tests" ever ran, which is a different problem this step does
      # not try to diagnose.
      - name: Print test failure summary
        if: always()
        run: node scripts/tap-failures.mjs test-output.tap

      # The summary above is deliberately lossy (a `not ok` line plus its
      # `location:` and `error:`, nothing else) so it survives truncation;
      # the full TAP stream is still needed for anything beyond that (a
      # stack trace, a neighboring test's output for context), so it is
      # uploaded here rather than only summarized. `if-no-files-found: warn`
      # matches the summary step's own graceful handling of a missing file —
      # this step must not itself fail the job over a file that legitimately
      # does not exist because an earlier step never ran.
      - name: Upload full test output (TAP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-tap
          path: test-output.tap
          retention-days: 7
          if-no-files-found: warn

      # Required-receipt enforcement for the AUC-24 structural-degradation
      # floor (CLAUDE.md). CI cannot verify the AUC VALUE — the corpus is
      # local-only and copyright-restricted, and mounting it via secrets was
      # rejected as a corpus-transport mechanism. What CI CAN do is make
      # silent omission of the human measurement step impossible: this step
      # fails the build when a scoring-path file (doctor.ts, emotional-arc.ts,
      # fountain-analyzer.ts, calibration/**, revision/passes/**, or anything
      # reachable from doctor.ts's import graph — see the script's own header
      # for the full reasoning) changed in this PR/push without a matching,
      # content-bearing update to docs/p1-benchmark/MEASUREMENT_RECEIPTS.md in
      # the same range. Deliberately BLOCKING (no continue-on-error) — a gate
      # that can be silently disabled by the thing it gates is not a gate
      # (see tests/core/ci-gates-intact.test.ts's header for why that matters
      # here specifically).
      #
      # PUSH_BEFORE_SHA is what makes this step real on push events. The guard
      # used to hardcode `origin/main...HEAD` whenever CI was set; on a
      # push-to-main run those refs are the SAME commit, the range is empty,
      # and the step printed "no scoring-path files changed. OK." regardless of
      # what the push contained — ~182 main-push runs gated by nothing, which
      # is exactly how the 2026-08-08 fabricated receipt reached main. On a
      # `push` the guard now diffs the PUSHED range; on a `pull_request` it
      # keeps the three-dot branch range. The script also reads
      # $GITHUB_EVENT_PATH directly, so dropping this env block does not
      # silently reopen the hole — but wire it anyway, it is the explicit
      # contract. (Pinned by tests/core/scoring-receipt-guard.test.ts.)
      # Skipped on a docs-only push: by definition no scoring-path file
      # changed, so the guard has nothing to require a receipt for.
      - name: Scoring-path change requires a measurement receipt
        if: needs.classify.outputs.docs_only != 'true'
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: npm run check-scoring-receipt

      # Reports which env-gated suites did NOT run: "0 failures" above does not
      # mean the AUC ratchet was checked — it is skipped here. This step used to
      # be non-blocking BY DESIGN, and the 2026-09-02 retrospective (finding #9)
      # named that as the failure it looks like: a gap reported forever is a gap
      # nobody has to close. Each gate may now carry an `expires` date; the
      # script exits 1 once a still-open gate is past it, and this step fails.
      # It is deliberately NOT continue-on-error, and tests/scripts/report-
      # unverified-gates.test.ts covers the date arithmetic that decides it.
      - name: Report unverified gates
        if: always()
        run: node scripts/report-unverified-gates.mjs

      # Hard metamorphic invariants must hold; empty_verbosity is a known-failing
      # witness (verbosity bias) and does not fail this step — see
      # evals/scoring/runner/metamorphic-lib.ts + docs/scoring/VERBOSITY_BIAS_2026-07-11.md.
      # Skipped on a docs-only push: exercises the scoring engine over fixture
      # scripts, which such a push by definition never touches.
      - name: Metamorphic scoring gate
        if: needs.classify.outputs.docs_only != 'true'
        run: npm run test:metamorphic

      # Skipped on a docs-only push: the built bundle is a function of
      # src/**/server/**/package.json, none of which such a push touches.
      - name: Build
        if: needs.classify.outputs.docs_only != 'true'
        run: npm run build
        env:
          GEMINI_API_KEY: "test-key-ci"

  # ──────────────────────────────────────────────────────────────────────────
  # The browser battery. Eight live-Chromium suites (smoke-p0-live-flow,
  # verify-focus-traps, verify-p2-p3-surfaces, verify-ui-polish-affordances,
  # verify-e4-local-safety-net, verify-e5-command-palette, verify-a11y,
  # verify-production-build) that boot the real server and drive the real UI.
  #
  # verify-a11y is the systematic accessibility pass (2026-09-04): an
  # axe-core sweep of every primary surface in both themes, plus a fully
  # keyboard-only run of the primary journey (land -> paste -> analyze ->
  # read a finding -> jump to it -> export). It found and this pass fixed
  # real bugs the other five suites' spot-checks never exercised — see its
  # own header for the full account, including one KNOWN, filed-not-fixed
  # issue it deliberately still asserts rather than hides.
  #
  # WHICH FRONT END EACH SUITE DRIVES. server/app.ts serves either Vite dev
  # middleware (NODE_ENV unset) or the built dist/ (NODE_ENV=production:
  # different static serving, Cache-Control, compression, and a CSP header
  # that plain doesn't exist in dev). Two of the eight take the production
  # branch — smoke-p0-live-flow (since 2026-09-12; it is the gate that blocks
  # `publish` in release.yml, so it certifies the bundle that gets published,
  # and it builds dist/ itself when stale, which is why this job still needs
  # no build step) and verify-production-build. The other six boot with
  # NODE_ENV unset. Every boot reads the mode back off the wire and prints it,
  # so a suite can no longer certify one app while its header describes the
  # other.
  #
  # verify-production-build remains the one that proves the DEPLOY command:
  # it runs `npm run build` itself and boots the SAME `npx tsx` CMD the
  # Dockerfile does. See the suite's own header for what it found and fixed
  # (2026-09-04): the static server had no response compression, no
  # cache-header differentiation between hashed assets and index.html, and a
  # miss under /assets/ silently 200'd the SPA shell instead of 404ing.
  #
  # These used to run on exactly ONE machine. Three of their own headers
  # asserted they "must not be wired into CI" because "CI has no browser
  # provisioned" — a self-imposed limitation, not a fact: an ubuntu runner
  # provisions Chromium in the one step below. The consequence of the old
  # claim was measured, not hypothetical: the SSE migration broke the
  # report-render wait in two suites and an ARIA role change broke a selector
  # in a third, and all three rotted for days because nothing ran them.
  #
  # A SEPARATE JOB on purpose: it runs in parallel with `test`, so provisioning
  # a browser (~1 browser download) never lengthens the lint/test path, and a
  # browser-infrastructure flake is legible as such instead of being mixed into
  # the unit-test signal. `playwright` is a pinned devDependency, so the
  # installed browser build always matches the client driving it.
  #
  # SKIPPED WHOLESALE on a docs-only push (job-level `if:`, not a per-step
  # one): none of these eight suites can be affected by a docs/**-or-**/*.md
  # -only change, and skipping at job level also skips checkout/`npm ci`/the
  # Chromium download — the actual ~5-minute cost, not only the battery step
  # itself. Verified safe to skip entirely rather than "run but report success
  # quickly": `main`'s branch protection has no required status checks at all
  # (GitHub API, 2026-09-18 — `GET /repos/.../branches/main` returned
  # `"protected": false` and `required_status_checks.enforcement_level: "off"`,
  # empty `contexts`/`checks`), so a job that does not run (rather than one
  # that runs and reports "success") cannot block anything that currently
  # depends on it. If that ever changes, this job's `if:` needs to change to a
  # cheap-pass shape instead of a skip — see the audit README for the
  # reasoning this leans on.
  browser:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `npm ci` installs the Playwright CLIENT only — modern playwright
      # packages ship no browser-downloading install script, which is why this
      # step is explicit rather than implied. --with-deps adds the shared
      # libraries headless Chromium needs on a bare ubuntu image.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # PW_CHROMIUM_PATH is deliberately NOT set: unset means "let Playwright
      # resolve the build it pins", which is the path the step above
      # provisions. The env override exists for machines that pre-provision a
      # browser outside Playwright's cache (the development container), and
      # keeping it unset here is what proves the CI path really works.
      - name: Browser verification battery
        run: npm run verify:browser
