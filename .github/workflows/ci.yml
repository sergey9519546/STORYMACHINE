name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      # Mechanical enforcement of CLAUDE.md's "no console.* under server/**"
      # rule — a written convention only reliably holds when CI holds it.
      # grep exits 1 on no-match, so `!` inverts: any hit fails the build
      # and prints the offending lines.
      #
      # --exclude-dir/--exclude mirror the tsconfig.json quarantine of the
      # never-compiled v5.0 experimental "narrative OS" subsystem, EXCLUDING
      # BY FILE rather than by the whole kernel/ dir. server/nvm/kernel/ is
      # NOT fully dead: server/engine/Stage.ts imports live runtime values
      # from server/nvm/kernel/event-store.ts and adapters/commit-to-events.ts
      # (a small live closure fixed in place per the tsconfig comment). The
      # earlier `--exclude-dir=kernel` hid that whole closure — including
      # event-store.ts's console.* calls — from this gate on shipped code.
      # Now only the genuinely-dead kernel files (the v5-examples, trinity-gate,
      # integration, and adapters/type-enrichment experiments, plus their
      # __tests__ and verifiers subdirs) are excluded, so the live event-store
      # path stays covered. The fully-dead top-level dirs
      # (quantum/research/infinity-gate/planning/benchmarks) stay dir-excluded.
      # None of the excluded code is wired into the running server, so it isn't
      # held to the logger convention either; genuinely-live code stays covered.
      - name: Enforce no console.* under server/
        run: >-
          ! grep -rn 'console\.' server --include='*.ts'
          --exclude-dir=quantum --exclude-dir=research
          --exclude-dir=infinity-gate --exclude-dir=planning --exclude-dir=benchmarks
          --exclude-dir=__tests__ --exclude-dir=verifiers
          --exclude=type-enrichment.ts --exclude=type-enrichment.test.ts
          --exclude=v5-examples.ts --exclude=adapters.ts
          --exclude=event-store.test.ts --exclude=index.ts --exclude=integration.ts
          --exclude=trinity-gate.ts --exclude=trinity-gate-example.ts
          --exclude=trinity-gate-demo.ts

      # G0-08: user-facing honesty string audit — fails the build on
      # overclaim language ("Hollywood gold standard", "provably", stale
      # hardcoded rule/corpus counts, unverified superlatives, etc.) in the
      # shipped surface. See scripts/honesty-audit.mjs for scope and rules.
      - name: Honesty string audit
        run: npm run honesty-audit

      # Documentation quality check: scan markdown files for AI writing patterns
      # Uses avoid-ai-writing Tier 1 patterns (25 high-confidence markers)
      # Non-blocking (warnings only) to avoid false positives on legitimate usage
      - name: Check documentation quality
        run: npm run check-docs
        continue-on-error: true

      # Deliberately NO GEMINI_API_KEY here: the product's official keyless
      # analysis-only mode is what CI must prove. With a fake key set, the
      # "keyless" degradation paths construct a real client and attempt live
      # HTTPS calls to the AI provider (passing only because failures degrade)
      # — a flake source, an outbound network dependency, and a posture the
      # suite was never meant to test. The full suite passes keyless.
      - name: Run tests (keyless — analysis-only posture)
        run: npm test

      # Hard metamorphic invariants must hold; empty_verbosity is a known-failing
      # witness (verbosity bias) and does not fail this step — see
      # evals/scoring/runner/metamorphic-lib.ts + docs/scoring/VERBOSITY_BIAS_2026-07-11.md.
      - name: Metamorphic scoring gate
        run: npm run test:metamorphic

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: "test-key-ci"
