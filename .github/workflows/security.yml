name: Security

# Additive security gate. Runs alongside CI (see ci.yml) and never edits it.
# Three independent jobs:
#   - dependency-review: blocks PRs that introduce known-vulnerable
#     dependency versions in their diff (GitHub Advisory Database).
#   - npm-audit: fails on high/critical CVEs in the resolved production
#     dependency tree. BLOCKING since 2026-08-24 — the baseline was verified
#     clean (0 vulnerabilities with and without dev deps) before the escape
#     hatch was removed.
#   - codeql: semantic code scanning for the JavaScript/TypeScript surface.
#
# Matches ci.yml conventions (Node 22, checkout@v4, setup-node@v4 with
# cache: npm). See docs/AGENT_HANDOFF.md §"P1 — security residual" for
# context on the open DNS-rebinding/resolve-and-pin work this complements.
on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Every Monday 06:00 UTC — catches new advisories on unchanged code.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    # Only meaningful on PRs: it diffs the dependency change in the PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # REQUIRES A REPO SETTING: this action needs the Dependency graph
      # enabled (Settings > Code security and analysis > Dependency graph).
      # Without it the step fails every PR with "Dependency review is not
      # supported on this repository", which is a configuration error, not a
      # vulnerability finding.
      #
      # It is deliberately left BLOCKING rather than made continue-on-error:
      # a supply-chain gate that cannot fail is not a gate, and a silently
      # non-blocking step here would be indistinguishable from a clean run.
      # If this step is red, fix the setting — do not disable the step.
      # (See tests/core/ci-gates-intact.test.ts, which enforces exactly that.)
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          # Fail the PR on high/critical vulnerable packages in the diff.
          fail-on-severity: high

  npm-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # BLOCKING as of 2026-08-24. This step carried `continue-on-error: true`
      # with a comment saying to flip it "once the baseline is clean". The
      # baseline is clean and was verified before flipping: on the committed
      # package-lock.json, both `npm audit --omit=dev --audit-level=high` and
      # `npm audit --audit-level=high` report "found 0 vulnerabilities" (exit
      # 0). There is no pre-existing advisory left for the escape hatch to
      # accommodate, and a security step that cannot fail reports nothing a
      # reader can act on — it is indistinguishable from a clean run.
      #
      # If this goes red, a high/critical advisory landed in the resolved
      # production tree. Fix the dependency; do not restore continue-on-error.
      # (tests/core/ci-gates-intact.test.ts enforces that.)
      - name: npm audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # "javascript" covers the JS/TS surface (CodeQL analyzes TypeScript
        # under the javascript extractor). It was previously
        # "javascript-actions", which is not a CodeQL language id — the job
        # failed at init on every run with "Did not recognize the following
        # languages: javascript-actions", so this workflow has never actually
        # scanned anything.
        language: ["javascript"]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
