name: Edge Image

# Publishes ghcr.io/<owner>/storymachine:edge from the tip of `main` whenever
# CI (ci.yml) finishes green there — never on a PR, never on any other
# branch, and NEVER as :latest (that tag is release.yml's exclusively, and is
# reserved for a tagged, versioned release — see release.yml's own comment on
# why a prerelease version must not move it).
#
# WHY A SEPARATE FILE INSTEAD OF A NEW JOB IN release.yml:
# tests/core/ci-gates-intact.test.ts asserts release.yml mirrors ci.yml
# step-for-step (same step names AND same run bodies, per its "mirrored gate
# steps run the SAME commands" check) and that release.yml's `publish` job
# specifically needs [test, browser] with `packages: write` scoped to only
# that job. Wedging an edge-publish job into release.yml risks tripping one
# of those assertions for a change that has nothing to do with what they
# protect (release.yml's tag-triggered, versioned release path). A dedicated
# workflow file is invisible to that test (which only reads ci.yml,
# release.yml and security.yml) and keeps this concern from ever being able
# to weaken release.yml's mirror claim, deliberately at the cost of a little
# duplication with release.yml's own publish steps below.
#
# WHY workflow_run INSTEAD OF ANOTHER `on: push` TRIGGER: this workflow must
# publish an image built from a commit that has ACTUALLY PASSED ci.yml's
# gates ("a green push to main"), not merely reached main. Triggering on
# `push` directly here would race ci.yml — this file has no gates of its own
# to duplicate that race away without becoming a second release.yml (see
# above). `workflow_run` fires only after ci.yml's run for that commit has
# fully concluded, so `github.event.workflow_run.conclusion` is the real,
# already-computed verdict of BOTH ci.yml jobs (test and browser) for that
# exact SHA — no separate polling or job-status lookup needed.
#
# WHAT REAL RUNS HAVE NOW PROVEN (this block replaced an earlier one, written
# while GitHub Actions was blocked at the account level, which said "THIS
# CANNOT BE PROVEN BY A REAL RUN RIGHT NOW" — that statement is obsolete):
#
# The block lifted on 2026-09-13 and this workflow finally executed. Of its
# first 471 runs, 467 concluded `skipped`, 1 was a `startup_failure`, 3 were
# real build attempts, and ZERO succeeded — no :edge image has ever been
# published. All three real attempts (34752889476 and 34753539471 on
# 2026-09-13, then 34794216577 on main@be2341ac on 2026-09-14) failed at the
# same step, "Build and push :edge", with the same cause:
#
#     > [deps 4/4] RUN npm ci:
#     npm error command sh -c node-gyp rebuild
#     npm error gyp ERR! find Python Python is not set from command line or npm configuration
#     npm error gyp ERR! stack Error: Could not find any Python installation to use
#     npm error gyp ERR! cwd /app/node_modules/better-sqlite3
#
# `FROM node:22-alpine`, the base at the time, carries no python3/make/g++,
# which node-gyp needs to run at all; node:24-alpine, the base since
# 2026-09-18, carries none of them either. release.yml's `publish` job builds
# the same Dockerfile and would have failed identically, so the whole
# container delivery path was broken and nothing noticed. Fixed 2026-09-18 by
# adding `apk add --no-cache python3 make g++` to the Dockerfile's `deps`
# stage — see that file's comment for why node-gyp runs even though
# better-sqlite3 ships a bundled musl prebuild, and
# tests/core/dockerfile-toolchain.test.ts for the guard that keeps it there.
# The fixed image was built and booted end to end (/health 200, /ready 200,
# container HEALTHCHECK healthy, better-sqlite3 exercised at runtime) on
# node:22-alpine, evidence in docs/audits/2026-09-18-edge-image/README.md. The
# node:24-alpine image was built and booted the same way (/health 200, /ready
# 200, better-sqlite3 exercised at runtime); its HEALTHCHECK is covered in
# docs/audits/2026-09-18-node-24/README.md, which found the probe fails on a
# Docker host that maps `localhost` to ::1, on the node:22 image too.
# That probe now targets 127.0.0.1 and was measured healthy on such a host
# (docs/audits/2026-09-18-healthcheck-ipv4/README.md).
#
# WHY THE TRIGGER FILTERS ON `branches: [main]`:
# `workflow_run` fires on EVERY completion of CI, on EVERY branch. Without the
# filter, each lane-branch push manufactured a whole Edge Image run that
# existed only to evaluate the job-level `if:` below to false and skip — which
# is where 467 of those 471 runs came from, several per minute during parallel
# lane work. The job-level `concurrency` group cannot help: a skipped run never
# contends for it, because it skips before it starts. Filtering at the trigger
# means a CI completion on a lane branch creates no Edge run at all.
#
# `branches` here matches the branch of the TRIGGERING (upstream) run, not this
# workflow file's own ref — that distinction is the whole point, and it is easy
# to get backwards: a `workflow_run`-triggered run reports the head_sha and
# head_branch of the WORKFLOW FILE's ref (main), never the upstream run's. So
# the run list showing "main" for all 471 does NOT mean main triggered them.
# Correlating each skipped run against the CI run that preceded it shows the
# real upstream branches — lane/necessity-certificate, lane/story-bench,
# lane/edge-image-real — while the single run that actually executed
# (34794216577) is the one whose upstream CI really was on main.
#
# WHAT THE FILTER DOES NOT STOP (say this plainly — "the fix" is not total):
# `workflow_run` has no conclusion filter, so a RED CI run on main STILL
# creates an Edge Image run here, which the job-level `if:` below then skips.
# That residue is one run per red push to main — a few a week, against the
# several-per-minute the branch filter removed — and removing it would mean
# abandoning `workflow_run` and with it the "already passed CI" guarantee that
# is the whole reason for this file. It is a deliberate remainder, not an
# oversight.
#
# The job-level `if:` below is KEPT as belt and braces, not made redundant:
# the trigger filter covers the branch only, while the `if:` also requires
# `conclusion == 'success'` and `event == 'push'`.
#
# WHY `event == 'push'` IS THE TOKEN-SCOPE CONTROL (corrected 2026-09-18 —
# this block previously said the surviving case was "a pull_request-event CI
# run targeting main", which is mechanically WRONG and would lead the next
# reader to conclude the condition is dead code):
# `branches:` matches the upstream run's HEAD branch, so a PR from `lane/foo`
# into main is ALREADY excluded by the filter — that case cannot occur. The
# case that actually survives `branches: [main]` is a pull request whose HEAD
# branch is itself named `main`: the ordinary shape of a fork contribution,
# and ci.yml's `pull_request: branches: ["**"]` means such a run exists here.
# A `workflow_run` workflow runs from the DEFAULT branch with the repository's
# own token, and this job holds `packages: write`, so `event == 'push'` is
# what stops a fork's `main` from reaching a registry-write credential — the
# classic "pwn-request" shape, not merely belt and braces. That is a STRONGER
# reason to keep it than the one this comment used to give.
# tests/core/ci-gates-intact.test.ts asserts both halves stay present — the
# trigger filter at the exact path `on.workflow_run.branches`, and all three
# conditions on the JOB's own `if:` — so neither can be deleted as "already
# covered", and neither can be demoted to a step.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-edge:
    # Only a completed, GREEN run of CI for a push to `main` itself (not a PR
    # build, not any other branch, and not a failed/cancelled run) publishes.
    # The `on:` block's `branches: [main]` filter already stops a lane branch's
    # CI completion from creating a run at all; these three conditions are the
    # belt-and-braces check on top of it. The head_branch line is deliberately
    # redundant with that filter; the conclusion and event lines are NOT
    # covered by it at all:
    #   conclusion  — workflow_run still fires for a FAILED CI run on main.
    #   event       — workflow_run still fires for a pull_request-event CI run
    #                 whose own HEAD branch is named `main`, i.e. a fork's
    #                 main. (NOT "a PR targeting main" — `branches:` matches
    #                 the upstream HEAD branch, so a lane-branch PR into main
    #                 never gets here. See the `on:` block's corrected note.)
    #                 This job holds `packages: write`, so that line is a
    #                 token-scope control against a pwn-request, not padding.
    # This `if:` must stay at the JOB level. Demoting it to a step would still
    # create the run, check out the commit and grant `packages: write` before
    # the step declined — which is most of the blast radius.
    # Do not delete any of the three as "handled by the trigger now"
    # (tests/core/ci-gates-intact.test.ts asserts all three ON THE JOB's `if:`,
    # and the filter at the exact path `on.workflow_run.branches`).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # Scoped to this job only, same reasoning as release.yml's `publish` job:
    # the registry-write token must never be inherited by a step that runs
    # arbitrary installed code (there is no such step here, but the pattern
    # stays consistent so a future edit does not have to relearn it).
    permissions:
      contents: read
      packages: write
    # A second push to main while an edge build is still running should
    # replace it, not queue behind it — :edge is a moving pointer, not a
    # retained version like release.yml's tags.
    concurrency:
      group: edge-image
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Build exactly the commit CI just certified, not whatever `main`
          # has moved to since (workflow_run's checkout defaults to the
          # workflow FILE's own ref, which is not what we want to build).
          ref: ${{ github.event.workflow_run.head_sha }}
          # Two commits, not one: the gate below diffs `<head_sha>^..<head_sha>`
          # and a depth-1 checkout has no parent to diff against. Nothing else
          # here reads history, so 2 is the whole requirement.
          fetch-depth: 2

      # ────────────────────────────────────────────────────────────────────
      # Do not rebuild an image this commit cannot have changed.
      #
      # WHY THIS EXISTS. `.github/workflows/ci.yml` gained a docs-only fast
      # path on 2026-09-18: a push whose every file is documentation now
      # finishes CI in ~1-2 minutes instead of ~9. It still concludes
      # `success`, and a `success` on `main` is exactly what triggers this
      # workflow — so without this gate, the pushes that were just made cheap
      # were the ones buying a full `docker build --push`. Measured on the
      # lane that found it: run 34793742299 was a docs-only push to `main`
      # that concluded `success` and triggered edge run 34794216577.
      #
      # WHY IT RE-DERIVES INSTEAD OF IMPORTING CI'S ANSWER. This is a
      # `workflow_run` workflow. The `github.event.workflow_run` payload
      # carries `head_sha`, `head_branch` and `conclusion` — NOT the upstream
      # run's job outputs. `needs.classify.outputs.docs_only` is unreachable
      # from here, and so is any `needs:` on a job in another workflow. That
      # is established; do not try to bridge it.
      #
      # WHY NOT `classifyDocsOnly`, THE PREDICATE ci.yml USES. Because it
      # answers a different question and would be WRONG here.
      # `classifyDocsOnly` treats any `**/*.md` as documentation, which is
      # right for "which CI gates can this affect". But `.dockerignore`
      # re-includes `!server/**`, `!src/**` and `!public/**`, and thirteen
      # committed `*.md` files live under those trees; `Dockerfile:91` copies
      # `/app/server` into the runner stage, so they are IN the image.
      # Gating on `classifyDocsOnly` would skip a rebuild for a commit that
      # genuinely changes the image. `canSkipImageBuild` is the narrower
      # predicate — `docs/**` and root-level `*.md` only — and
      # `tests/core/edge-docs-gate.test.ts` pins the two `.dockerignore`
      # facts it rests on.
      #
      # FAILURE DIRECTION IS DELIBERATELY THE OPPOSITE OF ci.yml's. There, an
      # input the classifier cannot resolve runs every gate, because guessing
      # wrong means a gate silently skipped. Here, an input this step cannot
      # resolve BUILDS, because guessing wrong means a missing or stale
      # `:edge` — visible and recoverable — while over-building costs one
      # runner slot. `<head_sha>^` does not exist for a root commit or after a
      # shallow fetch, and the classifier could fail for reasons nobody
      # predicted; every one of those paths writes `docs_only=false` and exits
      # 0, so this step can never fail the job or block a publish.
      #
      # WHAT SKIPPING GIVES UP, stated rather than discovered later: the image
      # is a function of the context AND the build-args, and `GIT_SHA` below
      # moves on every commit. A skipped build leaves `:edge`'s `ENV GIT_SHA`
      # and its `org.opencontainers.image.revision` label naming the last
      # commit actually built, not `main`'s tip. If that label must track the
      # tip, retagging the existing manifest (`docker buildx imagetools
      # create`) is the cheap answer, not a rebuild — see
      # docs/audits/2026-09-18-ci-docs-fast-path/README.md.
      - name: Skip the image build for a commit outside the build context
        id: docsonly
        env:
          # Via env, not inline `${{ }}` in the script: the value is a
          # GitHub-supplied SHA rather than user input, but the repository's
          # posture is that no expression is interpolated into a shell body.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -uo pipefail
          if ! FILES=$(git diff --name-only --no-renames "${HEAD_SHA}^" "${HEAD_SHA}" 2>&1); then
            echo "cannot diff ${HEAD_SHA}^..${HEAD_SHA} (root commit, shallow fetch, or an unresolvable parent) — building"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"
          printf '%s\n' "$FILES" | sed 's/^/  /'
          # `--no-renames` for the same reason ci.yml's classifier carries it:
          # git prints only a detected rename's DESTINATION, so `git mv
          # server/x.ts docs/x.md` would otherwise look like a docs-only
          # change while deleting a file that is in the image. One
          # implementation of the allowlist, imported from the same module
          # ci.yml's classifier uses — dependency-free, no `npm ci` needed.
          if ! RESULT=$(printf '%s\n' "$FILES" | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { canSkipImageBuild } from "./scripts/lib/docs-only.mjs";
            const files = readFileSync(0, "utf8").split("\n").map((s) => s.trim()).filter(Boolean);
            process.stdout.write("docs_only=" + (canSkipImageBuild(files) ? "true" : "false") + "\n");
          '); then
            echo "classifier failed — building"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$RESULT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.docsonly.outputs.docs_only != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.docsonly.outputs.docs_only != 'true'
        uses: docker/setup-buildx-action@v3

      # Same lowercasing reasoning as release.yml: ghcr.io requires a
      # lowercase repository path, and github.repository is not guaranteed
      # lowercase.
      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push :edge
        if: steps.docsonly.outputs.docs_only != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VERSION=edge
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
          tags: ${{ steps.image.outputs.name }}:edge
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=edge
