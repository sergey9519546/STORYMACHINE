# Convenience layer over the README "Running a published image" docker run
# one-liner, which only ever passed 2 of .env.example's 30+ documented
# variables. Every variable name and default below is copied from
# .env.example / the code that reads it (server/lib/session-store.ts,
# server/app.ts) — grep those before changing one here.
#
# Quick start:
#   cp .env.example .env   # fill in GEMINI_API_KEY / OPENROUTER_API_KEY, or
#                           # leave both unset to run keyless in analysis-only
#                           # mode (see README "Environment Variables")
#   docker compose up -d
#   curl http://localhost:3000/health
#
# docker compose automatically reads a `.env` file next to this one (if
# present) to fill in the ${VAR:-default} references below — it is NOT the
# same mechanism as the commented `env_file:` line under the service, and it
# is not an error for that file to be absent (every reference here has a
# `:-default` fallback). Never commit a real `.env` — `.gitignore` already
# excludes `.env*`.
services:
  storymachine:
    # STORYMACHINE_TAG is a convenience for this compose file only — it is
    # not one of .env.example's server variables. Override it to pin a
    # version (`STORYMACHINE_TAG=1.2.3 docker compose up -d`) or track the
    # unversioned main branch (`STORYMACHINE_TAG=edge`) instead of `latest`.
    image: ghcr.io/<owner>/storymachine:${STORYMACHINE_TAG:-latest}
    # Build from source instead of pulling the published image — swap the
    # `image:` line above for this block (see README "Releases" for what
    # VERSION/GIT_SHA are used for; both are optional):
    # build:
    #   context: .
    #   args:
    #     VERSION: dev
    #     GIT_SHA: dev
    restart: unless-stopped
    # Compose's own SIGKILL deadline for `docker compose stop`/`down` —
    # default 10s if unset. Third follow-up review, 2026-09-04: SHUTDOWN_DRAIN_MS
    # below is set to 35s (a deliberate wait BEFORE server.close() even
    # runs), plus the app's own 10s hard-kill timer for in-flight requests
    # AFTER close() starts — 45s of graceful-shutdown time the app itself
    # asks for. Compose's default 10s grace period would SIGKILL the
    # container 25s before server.close() ever ran: the SQLite WAL flush in
    # its close callback never happens, in-flight requests get cut instead
    # of finishing, and the exit code is always 137 (128+SIGKILL) instead of
    # the app's own 0/1. 50s = 35s drain + 10s hard-kill + 5s margin. RAISE
    # BOTH TOGETHER: if you change SHUTDOWN_DRAIN_MS below, this must stay
    # comfortably above (drain-ms/1000 + 10 + margin), or Compose's own
    # deadline silently reintroduces the same defect.
    #
    # 2026-09-05 review finding B5: this used to be a hardcoded `50s`
    # literal while SHUTDOWN_DRAIN_MS right below it was env-overridable —
    # so `SHUTDOWN_DRAIN_MS=120000 docker compose up` silently reintroduced
    # the exact defect the paragraph above describes (SIGKILL at 50s, 70s
    # before server.close() ever ran, no WAL flush, exit 137), because only
    # ONE of the two numbers tied together by "RAISE BOTH TOGETHER" could
    # actually be raised from the environment. STOP_GRACE_PERIOD now mirrors
    # SHUTDOWN_DRAIN_MS's own `${VAR:-default}` shape so both are raised
    # together with one override, not one you have to remember to edit here
    # by hand. Compose's own syntax for this field is a plain duration
    # string ("50s", "2m30s") — it does not do arithmetic, so this is not
    # DERIVED from SHUTDOWN_DRAIN_MS (Compose can't read one env var to
    # compute another), it is a SEPARATE variable an operator raising
    # SHUTDOWN_DRAIN_MS must set to the same rule (drain-ms/1000 + 10 +
    # margin) — e.g. `SHUTDOWN_DRAIN_MS=120000 STOP_GRACE_PERIOD=145s`. See
    # README's Deployment section for the worked example.
    stop_grace_period: ${STOP_GRACE_PERIOD:-50s}
    ports:
      - "${PORT:-3000}:3000"
    # Loads every variable in .env into the container as-is (AI provider
    # keys included) — uncomment once you have run `cp .env.example .env`.
    # Left off by default so `docker compose config` (see below) never
    # requires a file this repo deliberately does not commit.
    # env_file:
    #   - .env
    environment:
      # ── AI provider (all optional — the server boots keyless into
      # analysis-only mode: doctor, diagnose, coverage, what-if, room,
      # interview receipts all work with no key at all) ──
      # GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

      # ── Server config ──
      PORT: ${PORT:-3000}

      # ── Session persistence and growth bounds (server/lib/session-store.ts) ──
      # SESSION_DB_DIR is left at the image's own default (./data/sessions,
      # i.e. /app/data/sessions given the image's WORKDIR) so it lines up
      # with the storymachine-data volume below with no extra config; set it
      # here only to point somewhere else inside that same volume, or to
      # :memory: to disable disk persistence entirely.
      SESSION_IDLE_TTL_MINUTES: ${SESSION_IDLE_TTL_MINUTES:-1440}
      SESSION_FILE_TTL_HOURS: ${SESSION_FILE_TTL_HOURS:-168}

      # ── Concurrency / session limits ──
      MAX_SESSIONS: ${MAX_SESSIONS:-100}
      MAX_ROOMS: ${MAX_ROOMS:-50}

      # ── Graceful-shutdown drain window (server.ts's shutdownDrainMs(), GET
      # /ready's draining state) — second follow-up review, 2026-09-04.
      # Delays server.close() by this many ms AFTER GET /ready has already
      # flipped to 503 {reason:"draining"} on SIGTERM/SIGINT, so a prober
      # that opens a FRESH connection per check — exactly what the
      # healthcheck below does, `wget` makes a new connection every time —
      # gets a real chance to land inside the window and see the 503, rather
      # than the port simply refusing it the instant close() runs (measured:
      # with this at 0, that happens within single-digit ms of the signal).
      # Set comfortably ABOVE this healthcheck's own `interval` below (30s)
      # so at least one check cycle falls inside the window; 35000 here is
      # 30s + 5s of margin. Bump both together if you widen `interval`.
      # ALSO stays below this service's own `stop_grace_period` above (50s =
      # this 35s + the app's own 10s hard-kill + margin) — raise both
      # together, since Compose SIGKILLs at its own deadline regardless of
      # what this app is still waiting on.
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-35000}

      # ── Session backups (server/lib/backup.ts, `npm run backup`) ──
      # Off by default (no BACKUP_INTERVAL_HOURS = no in-process timer, no
      # backup/ directory created) — matches the image's own keyless-first
      # default. BACKUP_DIR points at the storymachine-backups volume below
      # so a manual `docker compose exec storymachine npm run backup` (or the
      # timer, once enabled) persists snapshots across container restarts.
      BACKUP_DIR: /app/backup
      # BACKUP_INTERVAL_HOURS: 6
      # BACKUP_RETENTION_DAYS: 14
      # BACKUP_RETENTION_KEEP: 20

      # ── Optional admin/metrics tokens and reverse-proxy trust ──
      # Uncomment ADMIN_TOKEN / METRICS_TOKEN only if this container is
      # reachable by anything other than you on loopback — both routes are
      # loopback-only by default, so a same-host `curl` needs neither.
      # ADMIN_TOKEN: ${ADMIN_TOKEN:-}      # required for POST /api/ai-config[/test] from a non-loopback caller
      # METRICS_TOKEN: ${METRICS_TOKEN:-}  # required for GET /metrics from a non-loopback caller
      # Uncomment TRUST_PROXY only when a reverse proxy or load balancer
      # (nginx, Cloudflare, a PaaS edge) terminates in front of this
      # container — otherwise every request's client IP collapses onto the
      # proxy's own address for rate limiting. Leave unset for a direct,
      # no-proxy deployment (e.g. `ports:` above exposed straight to the
      # internet) — see README "Reverse proxies and rate limiting".
      # TRUST_PROXY: "1"
      # Required in production if you also run the collaborative-editing
      # WebSocket with more than one server process/restart:
      # COLLAB_SECRET: ${COLLAB_SECRET:-}
      # COLLAB_MAX_ROOMS: ${COLLAB_MAX_ROOMS:-200}
    volumes:
      # Per-session SQLite files (data/sessions/) and reset-recovery
      # artifacts (data/backups/session-resets/) — see README "Session data".
      - storymachine-data:/app/data
      # Periodic full-DB backup snapshots (`npm run backup` / BACKUP_DIR
      # above) — separate from storymachine-data because the two have
      # different retention/lifecycle policies (see README "Backing it up
      # safely").
      - storymachine-backups:/app/backup
    healthcheck:
      # Same check as the image's own Dockerfile HEALTHCHECK — restated here
      # so `docker compose ps` reports health without relying on the image
      # having one baked in (e.g. when building locally from an older tag).
      # /ready, not /health (2026-09-04 ops audit finding A): /health answers
      # 200 unconditionally from the moment the port accepts connections, so
      # it never told `docker compose ps` (or a load balancer reading the
      # same signal) about the measured warm-up window ("~2.1–2.7 s on an
      # idle box, up to ~3.9 s under load (measured 2026-09-04/05)" —
      # warmDoctorPool()'s own doc comment, server/nvm/analyze/
      # doctor-pool.ts, the one place this figure is defined) where the
      # Script Doctor worker pool is still pre-warming and a request would pay the full
      # cold-start cost. /ready answers 503 until that pre-warm settles, then
      # 200 until this process begins shutting down — NOT rate limited, so
      # ordinary application load can never make this healthcheck itself
      # read as unhealthy. SIGTERM/SIGINT flip /ready back to 503 first
      # (draining), but since THIS probe opens a fresh connection every
      # check, it only actually observes that 503 because SHUTDOWN_DRAIN_MS
      # above is set well past this healthcheck's own interval — with it at
      # 0 (the bare-image default), draining and the socket closing happen
      # in the same tick and a fresh-connection probe like this one gets
      # refused instead of ever seeing 503. See server.ts's
      # shutdownDrainMs() and GET /ready's comment in
      # server/routes/config.ts for the measured timeline. start_period
      # widened to 15s (from 10s) to comfortably cover the measured warm-up
      # ("~2.1–2.7 s on an idle box, up to ~3.9 s under load (measured
      # 2026-09-04/05)" — warmDoctorPool()'s own doc comment,
      # server/nvm/analyze/doctor-pool.ts) with headroom.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  storymachine-data:
  storymachine-backups:
